<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZportSone - Marcadores y Resultados</title>

    <!-- Bootstrap 5 CSS & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.7);
            --accent-green: #00ff88;
            --accent-blue: #00d2ff;
            --text-light: #f1f5f9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar adaptativo con Glassmorphism */
        .navbar-custom {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: #cbd5e1 !important;
            font-weight: 600;
            margin: 0 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-green) !important;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-green);
            border-radius: 2px;
        }

        /* Encabezado */
        .page-header {
            padding: 50px 0 30px 0;
            background: radial-gradient(circle at top left, rgba(0, 255, 136, 0.1), transparent 40%);
        }

        /* Botones de filtro por deporte */
        .btn-filter {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 25px;
            padding: 8px 20px;
            margin: 4px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-filter:hover, .btn-filter.active {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
            font-weight: 700;
        }

        /* Tarjeta de Marcador Deportivo */
        .match-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .match-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.15);
        }

        .match-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 12px;
            font-weight: 700;
        }

        .score-box {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
            padding: 5px 15px;
            border-radius: 10px;
            display: inline-block;
        }

        /* Footer */
        footer {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: #070a12;
        }
    </style>
</head>
<body>

    <!-- Menú de Navegación Responsivo -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-bolt me-2"></i>ZportSone
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-center py-3 py-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i> Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="resultados.html"><i class="fa-solid fa-trophy me-1"></i> Resultados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="academia.html"><i class="fa-solid fa-graduation-cap me-1"></i> Academia</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header de la Página -->
    <section class="page-header text-center">
        <div class="container">
            <h1 class="display-5 fw-bold mb-2">Marcadores en <span style="color: var(--accent-blue)">Tiempo Real</span></h1>
            <p class="text-secondary">Consulta los resultados más recientes de las principales ligas del mundo.</p>

            <!-- Filtros de Deporte -->
            <div class="d-flex flex-wrap justify-content-center mt-4">
                <button class="btn btn-filter active" onclick="filtrarDeporte('todos', this)">
                    <i class="fa-solid fa-globe me-1"></i> Todos
                </button>
                <button class="btn btn-filter" onclick="filtrarDeporte('futbol', this)">
                    <i class="fa-solid fa-football me-1"></i> Fútbol
                </button>
                <button class="btn btn-filter" onclick="filtrarDeporte('baloncesto', this)">
                    <i class="fa-solid fa-basketball me-1"></i> Baloncesto
                </button>
                <button class="btn btn-filter" onclick="filtrarDeporte('tenis', this)">
                    <i class="fa-solid fa-baseball me-1"></i> Tenis
                </button>
            </div>
        </div>
    </section>

    <!-- Contenedor Dinámico de Marcadores -->
    <section class="py-4">
        <div class="container">
            <div class="row g-4" id="gridResultados">
                <!-- Se llena dinámicamente con resultados.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-4 text-center text-secondary">
        <div class="container">
            <small>&copy; 2026 ZportSone. Todos los derechos reservados.</small>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="resultados.js"></script>
</body>
</html>
