<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZportSone - Academia Deportiva</title>

    <!-- Bootstrap 5 CSS & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.7);
            --accent-green: #00ff88;
            --accent-blue: #00d2ff;
            --accent-pink: #ff007f;
            --text-light: #f1f5f9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar adaptativo con Glassmorphism */
        .navbar-custom {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: #cbd5e1 !important;
            font-weight: 600;
            margin: 0 8px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--accent-green) !important;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-green);
            border-radius: 2px;
        }

        /* Header de Academia */
        .page-header {
            padding: 50px 0 30px 0;
            background: radial-gradient(circle at top right, rgba(0, 210, 255, 0.15), transparent 45%);
        }

        /* Buscador estilizado */
        .search-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 8px 20px;
            color: #fff;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            color: #fff;
            outline: none;
        }

        /* Botones de filtro de categorías */
        .btn-academy-filter {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 20px;
            padding: 6px 18px;
            margin: 3px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-academy-filter:hover, .btn-academy-filter.active {
            background: var(--accent-blue);
            color: #000;
            border-color: var(--accent-blue);
            font-weight: 700;
        }

        /* Tarjeta de Curso / Módulo */
        .course-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .course-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-pink);
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.2);
        }

        .course-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(0, 210, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--accent-blue);
            margin-bottom: 15px;
        }

        /* Footer */
        footer {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: #070a12;
        }
    </style>
</head>
<body>

    <!-- Menú de Navegación Responsivo -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-bolt me-2"></i>ZportSone
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-center py-3 py-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i> Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="resultados.html"><i class="fa-solid fa-trophy me-1"></i> Resultados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="academia.html"><i class="fa-solid fa-graduation-cap me-1"></i> Academia</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header de la Academia -->
    <section class="page-header text-center">
        <div class="container">
            <h1 class="display-5 fw-bold mb-2">Academia de <span style="color: var(--accent-pink)">Conocimiento Deportivo</span></h1>
            <p class="text-secondary max-width-600 mx-auto">
                Domina las reglas, términos clave y estrategias tácticas del Fútbol, la NFL y la Fórmula 1.
            </p>

            <!-- Buscador y Filtros -->
            <div class="row justify-content-center mt-4 g-3">
                <div class="col-md-6 col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-secondary border-secondary border-opacity-25 rounded-start-pill ps-3">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="inputBuscador" class="form-control search-box border-start-0 rounded-end-pill" placeholder="Buscar término o regla (ej. Offside, Safety, DRS)...">
                    </div>
                </div>
            </div>

            <!-- Filtros por disciplina -->
            <div class="d-flex flex-wrap justify-content-center mt-3" id="contenedorFiltros">
                <button class="btn btn-academy-filter active" onclick="filtrarCategoria('todas', this)">Todas las Disciplinas</button>
                <button class="btn btn-academy-filter" onclick="filtrarCategoria('futbol', this)"><i class="fa-solid fa-football me-1"></i> Fútbol</button>
                <button class="btn btn-academy-filter" onclick="filtrarCategoria('nfl', this)"><i class="fa-solid fa-helmet-un me-1"></i> NFL</button>
                <button class="btn btn-academy-filter" onclick="filtrarCategoria('f1', this)"><i class="fa-solid fa-flag-checkered me-1"></i> Fórmula 1</button>
            </div>
        </div>
    </section>

    <!-- Tarjetas de Módulos de Aprendizaje -->
    <section class="py-4">
        <div class="container">
            <div class="row g-4" id="gridAcademia">
                <!-- Se puebla dinámicamente con academia.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-4 text-center text-secondary">
        <div class="container">
            <small>&copy; 2026 ZportSone. Todos los derechos reservados.</small>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="academia.js"></script>
</body>
</html>
